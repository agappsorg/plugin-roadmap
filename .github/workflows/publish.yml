name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
      - name: Publish
        run: |
          # Remove private flag and publish
          node -e "const p=require('./package.json'); delete p.private; p.name='@agapps/plugin-roadmap'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2))"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
